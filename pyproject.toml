[project]
name = "cot-guard"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic==0.71.0",
    "datasets==4.8.4",
    "filelock==3.29.0",
    "fire==0.7.1",
    "google-genai==1.73.1",
    "gpustat==1.1.1",
    "inspect-ai==0.3.205",
    "litellm==1.83.13",
    "numpy==2.2.6",
    "openai==2.24.0",
    "python-dotenv==1.0.1",
    "pyyaml==6.0.3",
    "rich==15.0.0",
    "termcolor==3.3.0",
    "torch==2.9.0",
    "tqdm==4.67.3",
    "vllm==0.13.0",
]

[dependency-groups]
dev = [
    "pytest==8.2.0",
]

[tool.uv]
package = false
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
